<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 ERROR</title>

<style>
* {
  box-sizing: border-box;
}

.card-link {
  text-decoration: none;
  color: inherit;
}

.card-link:hover .card {
  transform: scale(1.03);
  transition: 0.2s;
  cursor: pointer;
}

body {
  margin: 0;
  font-family: Arial;
  background-image: url("original.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.container {
  display: grid;
  grid-template-areas:
    "navbar"
    "content"
    "footer";
  grid-template-rows: 60px 1fr 50px;
  min-height: 100vh;
}

.navbar {
  grid-area: navbar;
  background: black;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  font-size: 14px;
}

.nav-links a:hover {
  text-decoration: underline;
}

.content {
  grid-area: content;
  padding: 20px;
}

.footer {
  grid-area: footer;
  background: black;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
}

.shows {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
}

.card {
  border: 1px solid #ccc;
  border-radius: 10px;
  overflow: hidden;
  background: white;
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.card h4 {
  margin: 10px;
}

.card p {
  margin: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="navbar">
    <h2>404 ERROR
    </h2>

    <div class="nav-links">
      <a href="#">Início</a>
      <a href="#">Shows</a>
      <a href="#">Agenda</a>
      <a href="#">Contato</a>
    </div>
  </div>

  <div class="content">
    <h3>Shows ao vivo</h3>

    <div class="shows">

      <a href="paginaIlan.html" class="card-link">
        <div class="card">
          <img src="https://picsum.photos/300/200?1">
          <h4>Banda Rock</h4>
          <p>Sexta - 22h</p>
        </div>
      </a>
      
      <div class="card">
        <img src="https://picsum.photos/300/200?2">
        <h4>DJ Night</h4>
        <p>Sábado - 00h</p>
      </div>

      <div class="card">
        <img src="https://picsum.photos/300/200?3">
        <h4>Acústico</h4>
        <p>Domingo - 19h</p>
      </div>

    </div>
  </div>

  <div class="footer">
    <p>© 2026 404 ERROR live-house</p>
  </div>

</div>

</body>
</html>
