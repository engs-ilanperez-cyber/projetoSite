<!--grid-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 ERROR Casa ao-vivo</title>
</head>
<style>
html, body {
  height: auto;
  margin: 0;
}
.container {
  display: grid;
  grid-template-areas:
    "navbar navbar"
    "menu content"
    "footer footer";
  grid-template-columns: 1fr 3fr;
  grid-template-rows: auto 1fr auto;
  gap: 3px;
  background-color: rgb(248, 181, 220);
  padding: 5px;
  min-height: 100vh;
}
.container div {
border: 1rem;
}
.container div.navbar {
  color: aliceblue;
  background-color: black;
  width: 98.8%;
  height: 48px;
  z-index: 100;
  grid-area: navbar;
  text-align: left;
  line-height: 7px;
  padding-left: 16px;
  
}

.container div.menu {
  max-width: max-content;
  min-width: min-content;
  padding-top: 60%;
  text-align: center;
  grid-area: menu;
}
.container div.content {
  
  grid-area: content;
}
.container div.footer {
  grid-area: footer;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

  <div class="navbar"><h2>404 ERROR</h2></div>
  
  <div class="menu"><a href="#">Link 1</a><br><a href="#">Link 2</a><br><a href="#">Link 3</a></div>

  <div class="content"><h3>Lorem Ipsum</h3>

    <p>
      Lorem ipsum odor amet, consectetuer adipiscing elit. Ridiculus sit nisl laoreet facilisis aliquet. Potenti dignissim litora eget montes rhoncus sapien neque urna. Cursus libero sapien integer magnis ligula lobortis quam ut.
    </p>
    <div>

  <div class="footer"><h4>Footer</h4></div>

</div>
</body>
</html>
