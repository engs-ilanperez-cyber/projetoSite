<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Banda Rock - Compra</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial;
  color: white;

  background-image: url("original (1).png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.container {
  max-width: 600px;
  margin: 50px auto;
  background: #1c1c1c;
  padding: 20px;
  border-radius: 10px;
}

h1 {
  text-align: center;
}

form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input, select {
  padding: 10px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 12px;
  background: #ff4da6;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #ff1a8c;
}

.back {
  display: block;
  margin-top: 15px;
  text-align: center;
  color: #aaa;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

  <h1>Banda Rock</h1>
  <p><strong>Data:</strong> Sexta - 22h</p>
  <p><strong>Local:</strong> Casa ao-vivo</p>

  <form>

    <label>Nome completo:</label>
    <input type="text" placeholder="Seu nome" required>

    <label>Email:</label>
    <input type="email" placeholder="seu@email.com" required>

    <label>Tipo de ingresso:</label>
    <select required>
      <option value="">Selecione</option>
      <option>Pista</option>
      <option>Camarote</option>
      <option>VIP</option>
    </select>

    <label>Assento:</label>
    <select required>
      <option value="">Escolha um assento</option>
      <option>A1</option>
      <option>A2</option>
      <option>B1</option>
      <option>B2</option>
    </select>

    <button type="submit">Comprar ingresso</button>

  </form>

  <a href="index.html" class="back">⬅ Voltar</a>

</div>

</body>
</html>
